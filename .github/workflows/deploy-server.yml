name: Deploy homepage server

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "DEPLOYMENT_PLAN.md"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment configuration
        id: config
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          if [ -n "$SERVER_HOST" ] && [ -n "$SERVER_USER" ] && [ -n "$SERVER_SSH_KEY" ] && [ -n "$SERVER_KNOWN_HOSTS" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip deployment when SSH secrets are missing
        if: steps.config.outputs.configured != 'true'
        run: echo '::notice::Server deployment skipped; configure SERVER_HOST, SERVER_USER, SERVER_SSH_KEY, and SERVER_KNOWN_HOSTS.'

      - name: Configure SSH
        if: steps.config.outputs.configured == 'true'
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "SERVER_PORT=${SERVER_PORT:-22}" >> "$GITHUB_ENV"

      - name: Sync project files
        if: steps.config.outputs.configured == 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude=.wrangler \
            --exclude=worker/.dev.vars \
            --exclude=outputs \
            --exclude=work \
            -czf - . | ssh -i ~/.ssh/deploy_key -p "${SERVER_PORT:-22}" -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" 'mkdir -p /home/bacon/project/my_home_page && tar -xzf - -C /home/bacon/project/my_home_page'

      - name: Build, restart, and check service
        if: steps.config.outputs.configured == 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SERVER_PORT:-22}" -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" \
            'cd /home/bacon/project/my_home_page && docker compose up -d --build && test "$(docker inspect --format="{{.State.Health.Status}}" my_home_page-homepage-1)" = healthy'
